name: Build and Push

on:
  workflow_dispatch:
    inputs:
      directory:
        description: Directory
        required: true
        type: choice
        options:
          - backend
          - frontend
          - keycloak
          - postgres
          - tools
      platforms:
        description: Target Platforms (comma separated)
        required: true
        default: linux/amd64,linux/arm64
      builder_mode:
        description: Build Mode
        required: true
        type: choice
        default: docker-cloud
        options:
          - github
          - docker-cloud

jobs:
  build-multiplatform:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'prod' || '' }}
    strategy:
      matrix:
        enterprise: ${{ inputs.directory == 'backend' && fromJSON('["false", "true"]') || fromJSON('["false"]') }}
    name: Build and Push (${{ inputs.directory }}${{ inputs.directory == 'backend' && matrix.enterprise == 'true' && ', Enterprise' || '' }})

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java # For Keycloak Java agent
        if: ${{ inputs.directory == 'keycloak' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build Keycloak Java agent
        if: ${{ inputs.directory == 'keycloak' }}
        working-directory: keycloak/agent
        run: mvn -B -ntp -DskipTests package

      - name: Set up QEMU (GitHub mode)
        if: ${{ inputs.builder_mode == 'github' }}
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx (GitHub mode)
        if: ${{ inputs.builder_mode == 'github' }}
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker (Build Cloud auth)
        if: ${{ inputs.builder_mode == 'docker-cloud' }}
        uses: docker/login-action@v3
        with:
          username: keyauthoritydh
          password: ${{ secrets.DOCKER_CLOUD_ACCESS_TOKEN }}

      - name: Set up Docker Buildx (Build Cloud mode)
        id: buildx_cloud
        if: ${{ inputs.builder_mode == 'docker-cloud' }}
        uses: docker/setup-buildx-action@v3
        with:
          driver: cloud
          endpoint: keyauthoritydh/docker-buildx

      - name: Set beta version for non-main branch
        shell: bash
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "BETA_VERSION=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: keyauthoritydh
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Build and push
        working-directory: ${{ inputs.directory }}
        env:
          BUILDER: ${{ inputs.builder_mode == 'docker-cloud' && steps.buildx_cloud.outputs.name || '' }}
        run: |
          echo "🚀 Building and pushing image..."
          echo "    Image: $(make print-img ENTERPRISE=${{ matrix.enterprise }})"
          echo "    Platforms: ${{ inputs.platforms }}"
          echo "    Build Mode: ${{ inputs.builder_mode }}"
          echo "    Beta: ${{ github.ref != 'refs/heads/main' && 'Yes' || 'No' }}"
          make docker-buildx PLATFORMS=${{ inputs.platforms }} ENTERPRISE=${{ matrix.enterprise }}
