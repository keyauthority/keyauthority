name: Build and Push

on:
  workflow_dispatch:
    inputs:
      directory:
        description: Directory
        required: true
        type: choice
        options:
          - backend
          - frontend
          - keycloak
          - postgres
          - tools
      platforms:
        description: Target Platforms (comma separated)
        required: false
        default: linux/amd64,linux/arm64
      builder_mode:
        description: Build mode
        required: true
        type: choice
        default: docker-cloud
        options:
          - github
          - docker-cloud

jobs:
  build-multiplatform:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'prod' || '' }}
    strategy:
      matrix:
        enterprise: ${{ inputs.directory == 'backend' && fromJSON('["false", "true"]') || fromJSON('["false"]') }}
    name: Build and Push (${{ inputs.directory }}${{ inputs.directory == 'backend' && matrix.enterprise == 'true' && ', Enterprise' || '' }})

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up QEMU (GitHub mode)
        if: ${{ inputs.builder_mode == 'github' }}
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx (GitHub mode)
        if: ${{ inputs.builder_mode == 'github' }}
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker (Build Cloud auth)
        if: ${{ inputs.builder_mode == 'docker-cloud' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_CLOUD_USERNAME }}
          password: ${{ secrets.DOCKER_CLOUD_ACCESS_TOKEN }}

      - name: Set up Docker Buildx (Build Cloud mode)
        if: ${{ inputs.builder_mode == 'docker-cloud' }}
        uses: docker/setup-buildx-action@v3
        with:
          driver: cloud
          endpoint: ${{ secrets.DOCKER_BUILD_CLOUD_BUILDER }}

      - name: Resolve registry
        shell: bash
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "REGISTRY=DockerHub" >> "$GITHUB_ENV"
            echo "IMG_REGISTRY=docker.io/keyauthoritydh" >> "$GITHUB_ENV"
            echo "TAG_SUFFIX=" >> "$GITHUB_ENV"
          else
            echo "REGISTRY=DigitalOcean" >> "$GITHUB_ENV"
            echo "IMG_REGISTRY=registry.digitalocean.com/keyauthority" >> "$GITHUB_ENV"
            echo "TAG_SUFFIX=-beta${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
          fi

      - name: Log in to DigitalOcean
        if: ${{ env.REGISTRY == 'DigitalOcean' }}
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: ${{ secrets.DIGITALOCEAN_USERNAME }}
          password: ${{ secrets.DIGITALOCEAN_PASSWORD }}

      - name: Log in to DockerHub
        if: ${{ env.REGISTRY == 'DockerHub' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push
        working-directory: ${{ inputs.directory }}
        run: |
          make docker-buildx PLATFORMS=${{ inputs.platforms }} ENTERPRISE=${{ matrix.enterprise }} IMG_REGISTRY=${{ env.IMG_REGISTRY }} TAG_SUFFIX=${{ env.TAG_SUFFIX }}
          echo "✅ Built and pushed image: $(make print-img)"